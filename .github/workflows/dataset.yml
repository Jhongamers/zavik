# Builds and publishes the signed Pro risk dataset (docs/design-data.md).
# Output: Release tag `dataset-latest` → `dataset.json` (Ed25519 envelope).
#
# After the repo exists (ROADMAP F0): fill `DEFAULT_DATASET_URL` in
# crates/cli/src/dataset.rs with this release URL, add the `DF_DATASET_KEY`
# secret, push, and trigger this workflow once to publish the first asset.
#
# Supply-chain stance: GitHub-official `actions/checkout` + the runner's
# preinstalled `gh`/rustup only — no third-party actions (we audit what we
# would ship).

name: dataset

on:
  schedule:
    # Diário (recomendado — design §9.2; trocar pra semanal é 1 linha).
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write # create/update the Release + its assets

concurrency:
  group: dataset-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (builder + public key embedded in the CLI)
        uses: actions/checkout@v4

      - name: Clone the advisory database (github-reviewed only — curated)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/github/advisory-database.git "$RUNNER_TEMP/ghsa"
          git -C "$RUNNER_TEMP/ghsa" sparse-checkout set advisories/github-reviewed

      - name: Rust toolchain (rustup, no third-party action)
        run: rustup toolchain install stable --profile minimal --no-self-update || rustc --version

      - name: Build the payload (GHSA → dataset, unsigned)
        run: |
          cargo run --quiet --example license_tool -- build-dataset \
            --src "$RUNNER_TEMP/ghsa/advisories/github-reviewed" \
            --out "$RUNNER_TEMP/payload.json"

      - name: Sign with the dataset key (separate from the license key)
        env:
          DF_DATASET_KEY: ${{ secrets.DF_DATASET_KEY }}
        run: |
          test -n "$DF_DATASET_KEY" || { echo "secret DF_DATASET_KEY ausente" >&2; exit 1; }
          cargo run --quiet --example license_tool -- sign-dataset \
            --in "$RUNNER_TEMP/payload.json" --out "$RUNNER_TEMP/dataset.json"

      - name: Verify against the key embedded in dataset.rs (catches a wrong secret BEFORE publishing)
        run: |
          pk=$(sed -n 's/.*DATASET_PUBLIC_KEY_B64: &str = "\([^"]*\)".*/\1/p' crates/cli/src/dataset.rs)
          test -n "$pk" || { echo "chave pública não encontrada em dataset.rs" >&2; exit 1; }
          cargo run --quiet --example license_tool -- verify-dataset \
            --in "$RUNNER_TEMP/dataset.json" --pubkey "$pk"

      - name: Publish Release asset (dataset-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          generated=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/payload.json'))['generated'])")
          if gh release view dataset-latest >/dev/null 2>&1; then
            gh release upload dataset-latest "$RUNNER_TEMP/dataset.json" --clobber
          else
            gh release create dataset-latest "$RUNNER_TEMP/dataset.json" \
              --title "dataset-latest" \
              --notes "dataset de risco assinado (ver docs/design-data.md)"
          fi
          gh release edit dataset-latest \
            --notes "dataset gerado em ${generated} — atualize com: devforge data update"
