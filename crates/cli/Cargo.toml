[package]
name = "devforge"
description = "Ponto de entrada (CLI) do agente DevForge."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "devforge"
path = "src/main.rs"

[dependencies]
devforge-shared.workspace = true
devforge-events.workspace = true
devforge-sdk.workspace = true
devforge-plugins.workspace = true
devforge-core.workspace = true
devforge-kernel.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
ctrlc.workspace = true

# Only for the example tool (license minting) and integration tests.
[dev-dependencies]
rand = "0.8"
tempfile.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
