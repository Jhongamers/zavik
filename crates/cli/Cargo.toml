[package]
name = "zavik"
description = "Ponto de entrada (CLI) do agente Zavik."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zavik"
path = "src/main.rs"

# The vendor tool's unit tests run with `cargo test` (builder = staged
# code, every stage tested).
[[example]]
name = "license_tool"
path = "examples/license_tool.rs"
test = true

[dependencies]
zavik-shared.workspace = true
zavik-events.workspace = true
zavik-sdk.workspace = true
zavik-plugins.workspace = true
zavik-core.workspace = true
zavik-kernel.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
ctrlc.workspace = true
# Same family the `--online` signals use (sync, no runtime) — `data update` download.
ureq = { version = "2" }

# Only for the example tool (license minting) and integration tests.
[dev-dependencies]
rand = "0.8"
tempfile.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }

# `run --detach`: setsid, so the background process survives the terminal.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
